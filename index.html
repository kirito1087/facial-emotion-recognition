<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FER — Facial Emotion Recognition</title>
  <meta name="description" content="Real-time facial emotion recognition in your browser. Detects 7 emotions using AI — all processing happens locally. No data leaves your device.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◉</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Ambient glow (emotion-reactive) -->
  <div class="ambient-glow"></div>
  <div class="ambient-glow-2"></div>

  <!-- Loading -->
  <div id="loading-screen">
    <div class="loader-ring"></div>
    <div class="loader-label">Loading models</div>
    <div class="loader-bar-track">
      <div class="loader-bar-fill" id="progress-bar"></div>
    </div>
  </div>

  <!-- App -->
  <div class="shell" id="shell">

    <!-- Topbar -->
    <nav class="topbar">
      <div class="brand">
        <div class="brand-mark" id="brand-mark"></div>
        <span class="brand-name">FER</span>
      </div>
      <div class="topbar-meta">
        <span class="topbar-tag">TensorFlow.js</span>
        <div class="topbar-status">
          <span class="status-pip" id="status-pip"></span>
          <span id="status-label">offline</span>
        </div>
      </div>
    </nav>

    <!-- Grid -->
    <div class="layout">

      <!-- Video feed -->
      <div class="feed">
        <div class="feed-viewport">
          <video id="webcam" autoplay playsinline muted></video>
          <canvas id="canvas"></canvas>

          <div class="feed-placeholder" id="placeholder">
            <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            <span>Camera off</span>
          </div>

          <div class="no-face-pill" id="no-face">no face detected</div>
        </div>

        <div class="feed-bar">
          <div class="feed-bar-left">
            <div class="feed-stat"><strong id="v-faces">0</strong> faces</div>
            <div class="feed-stat"><strong id="v-fps">0</strong> fps</div>
          </div>
          <button class="btn-toggle" id="btn">Start</button>
        </div>
      </div>

      <!-- Sidebar panel -->
      <div class="panel">

        <!-- Dominant -->
        <div class="dominant">
          <div class="dominant-eyebrow">Dominant Emotion</div>
          <span class="dominant-emoji" id="d-emoji">–</span>
          <div class="dominant-emotion" id="d-name">Waiting</div>
          <div class="dominant-score" id="d-score">—</div>
        </div>

        <!-- Radar chart -->
        <div class="radar-section">
          <div class="radar-eyebrow">Emotion Radar</div>
          <div class="radar-wrap">
            <canvas id="radar-canvas" width="480" height="480"></canvas>
          </div>
        </div>

        <!-- List -->
        <div class="emo-list">
          <div class="emo-row emo-happy">
            <span class="emo-icon">😊</span>
            <span class="emo-name">Happy</span>
            <div class="emo-track"><div class="emo-fill"></div></div>
            <span class="emo-pct">0%</span>
          </div>
          <div class="emo-row emo-sad">
            <span class="emo-icon">😢</span>
            <span class="emo-name">Sad</span>
            <div class="emo-track"><div class="emo-fill"></div></div>
            <span class="emo-pct">0%</span>
          </div>
          <div class="emo-row emo-angry">
            <span class="emo-icon">😠</span>
            <span class="emo-name">Angry</span>
            <div class="emo-track"><div class="emo-fill"></div></div>
            <span class="emo-pct">0%</span>
          </div>
          <div class="emo-row emo-surprised">
            <span class="emo-icon">😲</span>
            <span class="emo-name">Surprised</span>
            <div class="emo-track"><div class="emo-fill"></div></div>
            <span class="emo-pct">0%</span>
          </div>
          <div class="emo-row emo-fearful">
            <span class="emo-icon">😨</span>
            <span class="emo-name">Fearful</span>
            <div class="emo-track"><div class="emo-fill"></div></div>
            <span class="emo-pct">0%</span>
          </div>
          <div class="emo-row emo-disgusted">
            <span class="emo-icon">🤢</span>
            <span class="emo-name">Disgusted</span>
            <div class="emo-track"><div class="emo-fill"></div></div>
            <span class="emo-pct">0%</span>
          </div>
          <div class="emo-row emo-neutral">
            <span class="emo-icon">😐</span>
            <span class="emo-name">Neutral</span>
            <div class="emo-track"><div class="emo-fill"></div></div>
            <span class="emo-pct">0%</span>
          </div>
        </div>

      </div><!-- /panel -->
    </div><!-- /layout -->
  </div><!-- /shell -->

  <!-- Error toast -->
  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
  <script src="app.js"></script>
</body>
</html>
